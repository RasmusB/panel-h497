# Builds the driver against current Raspberry Pi OS kernels and compiles the
# overlay. Runs on every push/PR and weekly, so a new Raspberry Pi kernel that
# breaks the build is caught before customers hit it.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC

jobs:
  build:
    # Kernel header packages contain arm64 build tools, so build natively on arm64
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        release: [bookworm, trixie]
    container: debian:${{ matrix.release }}

    steps:
      - uses: actions/checkout@v5

      - name: Add Raspberry Pi apt repository
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl
          # Use the newest archive keyring package. The legacy raspberrypi.gpg.key
          # has SHA-1 self-signatures, which apt on trixie rejects.
          pool=https://archive.raspberrypi.com/debian/pool/main/r/raspberrypi-archive-keyring
          deb=$(curl -fsSL "$pool/" | grep -oE 'raspberrypi-archive-keyring_[^"]+_all\.deb' | sort -uV | tail -1)
          curl -fsSL -o /tmp/keyring.deb "$pool/$deb"
          dpkg -i /tmp/keyring.deb
          echo "deb [signed-by=/usr/share/keyrings/raspberrypi-archive-keyring.pgp] https://archive.raspberrypi.com/debian ${{ matrix.release }} main" \
            > /etc/apt/sources.list.d/raspi.list
          apt-get update

      - name: Install build dependencies and Raspberry Pi kernel headers
        run: |
          apt-get install -y --no-install-recommends \
            gcc make cpp device-tree-compiler kmod perl python3 \
            linux-headers-rpi-v8 linux-headers-rpi-2712

      - name: Build driver for each kernel
        run: |
          # Report the tail of a failed build as an annotation, which is
          # visible on the run page without opening the full log.
          annotate() {
            echo "::error title=$1::$(tail -40 "$2" | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"
          }
          for kdir in /usr/src/linux-headers-*-rpi-v8 /usr/src/linux-headers-*-rpi-2712; do
            kver=$(basename "$kdir" | sed 's/^linux-headers-//')
            echo "::group::$kver"
            if ! { make -C "$kdir" M="$PWD/driver" clean &&
                   make -C "$kdir" M="$PWD/driver" W=1 modules; } > build.log 2>&1; then
              cat build.log; echo "::endgroup::"
              annotate "build failed: $kver" build.log
              exit 1
            fi
            cat build.log
            modinfo driver/panel-h497.ko | grep -E 'vermagic|alias'
            mkdir -p out/$kver && cp driver/panel-h497.ko out/$kver/
            echo "::endgroup::"
          done

      - name: Compile overlay
        run: |
          ./compile-overlay.sh panel-h497.dts
          cp panel-h497.dtbo out/

      - uses: actions/upload-artifact@v5
        with:
          name: panel-h497-${{ matrix.release }}
          path: out/
